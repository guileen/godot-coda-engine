<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CODA is a language for clear Godot gameplay flows."><meta name="robots" content="index, follow"><meta name="theme-color" content="#fcfaf6">
    <title>Opening CODA</title><link rel="icon" href="data:,"><link rel="stylesheet" href="assets/styles.css">
  </head>
  <body class="grain">
    <main class="page language-gateway"><p class="eyebrow"><span class="status-dot" aria-hidden="true"></span> CODA</p><h1>Opening CODA…</h1><p class="hero-lede">正在为你打开 CODA…</p><noscript><p class="hero-note">请选择语言：<a class="text-link" href="en/">English</a> · <a class="text-link" href="zh-CN/">简体中文</a></p></noscript></main>
    <script>
      const saved = localStorage.getItem('coda-language');
      const languages = navigator.languages || [navigator.language || ''];
      const preferred = languages.find((language) => language.toLowerCase().startsWith('zh')) ? 'zh-CN' : 'en';
      const locale = saved === 'zh-CN' || saved === 'en' ? saved : preferred;
      localStorage.setItem('coda-language', locale);
      window.location.replace(`${locale}/`);
    </script>
  </body>
</html>
