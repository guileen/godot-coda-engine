name: CODA Core

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: coda-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coda-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm test
      - run: npm run check
      - run: npm run check:public
      - run: npm run coda -- manifest
      - run: npm run coda -- validate gseos/events/ui.reward.apply.gse.json
      - run: npm run coda -- generate gseos/events/ui.reward.apply.gse.json
